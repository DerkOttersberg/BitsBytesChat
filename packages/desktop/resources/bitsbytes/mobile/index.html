<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#171717" />
    <title>Bits &amp; Bytes Chat</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/copy.js"></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <section id="pair-screen" class="pair-screen" hidden>
      <h1 data-copy="brand"></h1>
      <label><span data-copy="device"></span><input id="device-name" maxlength="80" autocomplete="off" /></label
      ><button id="pair-button" data-copy="pair"></button>
      <p id="pair-status" role="status"></p>
    </section>
    <div id="app" hidden>
      <header>
        <button id="menu-button" data-label="chats">☰</button><strong id="chat-title" data-copy="brand"></strong
        ><span id="connection" role="status"></span><button id="files-button" data-copy="documents"></button>
      </header>
      <aside id="drawer" hidden>
        <div class="tabs">
          <button data-tab="chats" data-copy="chats"></button><button data-tab="skills" data-copy="skills"></button
          ><button data-tab="uploads" data-copy="uploads"></button>
        </div>
        <div id="drawer-body"></div>
        <button id="logout" class="subtle" data-copy="logout"></button>
      </aside>
      <main id="messages"></main>
      <div id="interactions"></div>
      <div id="queue-status"></div>
      <form id="composer">
        <div id="attachments"></div>
        <textarea id="prompt" rows="2" data-placeholder="placeholder"></textarea>
        <div id="recording-controls" hidden>
          <button id="recording-cancel" type="button" data-label="audioCancel">■</button>
          <span id="recording-time" role="timer">0:00</span>
          <span id="recording-status" role="status"></span>
          <span class="grow"></span>
          <button id="recording-pause" type="button" data-label="audioPause">Ⅱ</button>
          <button id="recording-finish" type="button" data-label="audioFinish">↑</button>
        </div>
        <div class="composer-row">
          <button id="audio-button" class="icon-button" type="button" data-label="choose"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 11-8.5 8.5a6 6 0 0 1-8.5-8.5l9-9a4 4 0 0 1 5.7 5.7l-9 9a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button
          ><select id="access" data-label="ask">
            <option value="ask" data-copy="ask"></option>
            <option value="auto" data-copy="autoApprove"></option>
            <option value="full" data-copy="full"></option></select
          ><span class="grow"></span><button id="record-button" class="icon-button" type="button" data-label="audioRecord"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg></button><button id="stop" type="button" data-copy="stop" hidden></button
          ><button id="steer" type="button" data-label="steer" hidden>↱</button
          ><button id="send" type="submit" data-label="send">↑</button>
        </div>
        <div class="model-row">
          <select id="model" data-label="model"></select
          ><select id="variant" data-label="reasoning"></select>
        </div>
      </form>
      <input id="audio-file" type="file" accept="audio/*,video/mp4,video/webm" hidden />
    </div>
    <div id="notice" role="alert" hidden></div>
    <dialog id="preview">
      <div class="preview-bar">
        <strong id="preview-title"></strong
        ><select id="versions" data-label="revision"></select
        ><a id="download" data-copy="download"></a><button id="preview-close" data-copy="close"></button>
      </div>
      <div id="preview-content"></div>
      <div id="pdf-controls" hidden>
        <button id="previous-page" data-copy="previous"></button><span id="pages"></span
        ><button id="next-page" data-copy="next"></button>
      </div>
    </dialog>
  </body>
</html>
